name: Update VPN Subs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Download Xray-core
        run: |
          wget -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip
          chmod +x xray
          ./xray version

      - run: python combine.py

      - name: Commit merged.txt
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add merged.txt
          git commit -m "Update subscriptions" || exit 0
          git push
