import requests
import datetime
import socket
import concurrent.futures

# Настройки
TIMEOUT = 5  # секунд на проверку
MAX_WORKERS = 100  # сколько серверов проверяем одновременно
MAX_SERVERS = 300  # максимум живых серверов в итоге

def extract_info(line):
    """Достаёт хост и порт из ссылки."""
    try:
        # vless://uuid@host:port?...
        host_port = line.split("@")[1].split("?")[0]
        if ":" in host_port:
            host, port = host_port.rsplit(":", 1)
            return host, int(port)
        else:
            return host_port, 443
    except:
        return None, None

def check_server(line):
    """Проверяет, открыт ли TCP-порт."""
    host, port = extract_info(line)
    if not host:
        return None
    try:
        with socket.create_connection((host, port), timeout=TIMEOUT):
            return line
    except:
        return None

# Скачиваем подписки
with open("sources.txt", "r", encoding="utf-8") as f:
    urls = [line.strip() for line in f if line.strip()]

all_lines = set()
for url in urls:
    try:
        r = requests.get(url, timeout=30, headers={"User-Agent": "Mozilla/5.0"})
        if r.status_code == 200:
            for raw in r.text.splitlines():
                raw = raw.strip()
                if not raw:
                    continue
                if not raw.startswith(("vless://", "vmess://", "trojan://", "ss://", "hysteria2://")):
                    continue
                # Убираем имя после #
                raw = raw.split("#")[0]
                # Убираем битые REALITY
                if "security=reality" in raw:
                    if "pbk=" not in raw or "pbk=&" in raw:
                        continue
                all_lines.add(raw)
    except:
        pass

print(f"Всего серверов после фильтрации: {len(all_lines)}")

# Проверяем работоспособность
alive = []
with concurrent.futures.ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
    results = executor.map(check_server, list(all_lines))
    for res in results:
        if res:
            alive.append(res)
            if len(alive) >= MAX_SERVERS:
                break

print(f"Живых серверов: {len(alive)}")

# Сохраняем
with open("merged.txt", "w", encoding="utf-8") as f:
    f.write("\n".join(alive))
